name: Site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    name: Types, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Tests du banc d'évaluation (Python)
        run: python3 -m unittest discover -s banc -v
      - name: Conserver le site construit
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    name: Mise en ligne
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
